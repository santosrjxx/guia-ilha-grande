# Painel de Admin — Guia Ilha Grande (Decap CMS)
#
# Backend de produção (GitHub via proxy de OAuth em /api/auth e /api/callback,
# rodando como Cloudflare Pages Function). Preencha "repo" e "base_url" depois
# de criar o repositório no GitHub e o projeto no Cloudflare Pages.
backend:
  name: github
  repo: santosrjxx/guia-ilha-grande
  branch: main
  base_url: https://guia-ilha-grande.moiclub.workers.dev
  auth_endpoint: api/auth

# Permite testar o painel 100% local, sem GitHub/Cloudflare, rodando `npm run cms`
# (decap-server) junto com `npm run dev`. Não afeta o backend de produção acima.
local_backend: true

site_url: https://www.guiailhagrande.com.br
display_url: https://www.guiailhagrande.com.br
logo_url: /logo-header.webp

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: articles
    label: Artigos
    label_singular: Artigo
    description: Todos os artigos do blog (onde comer, o que fazer, onde ficar, guia prático).
    folder: src/content/articles
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{silo}}"
    sortable_fields: [title, pubDate, silo]
    fields:
      - { label: "Título (H1 da página)", name: title, widget: string, hint: "Título principal, exibido no topo do artigo." }
      - label: "Título para SEO (opcional)"
        name: seoTitle
        widget: string
        required: false
        hint: "Se deixado em branco, usa o Título acima. É o texto que aparece na aba do navegador e no resultado do Google — pode ser diferente do H1 para otimizar cliques."
      - label: "Slug (endereço da URL)"
        name: slug
        widget: string
        hint: "Parte final do link da página. Ex.: praia-de-lopes-mendes vira /o-que-fazer/praia-de-lopes-mendes/. Evite alterar depois de publicado, pois isso muda o link do artigo."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use apenas letras minúsculas, números e hífens, sem espaços ou acentos"]
      - label: "Meta descrição (SEO)"
        name: description
        widget: text
        hint: "Texto exibido no resultado de busca do Google, abaixo do título. Ideal entre 120 e 160 caracteres."
      - label: Silo (categoria)
        name: silo
        widget: select
        options:
          - { label: "Onde Comer", value: "onde-comer" }
          - { label: "O Que Fazer", value: "o-que-fazer" }
          - { label: "Onde Ficar", value: "onde-ficar" }
          - { label: "Guia Prático", value: "guia-pratico" }
      - label: Imagem de destaque
        name: heroImage
        widget: image
        required: false
        media_folder: "/public/articles"
        public_folder: "/articles"
      - { label: "Texto alternativo da imagem (alt)", name: heroImageAlt, widget: string, required: false }
      - { label: Data de publicação, name: pubDate, widget: datetime }
      - { label: Data de atualização, name: updatedDate, widget: datetime, required: false }
      - { label: Autor, name: author, widget: string, default: "Equipe Guia Ilha Grande" }
      - label: Tags
        name: tags
        widget: list
        default: []
        required: false
      - { label: Rascunho (não publica no site), name: draft, widget: boolean, default: false }
      - { label: "Destaque (featured)", name: featured, widget: boolean, default: false }
      - { label: Popular, name: popular, widget: boolean, default: false }
      - label: Perguntas Frequentes (FAQ)
        name: faq
        widget: list
        required: false
        hint: "Aparece no fim do artigo, em formato sanfona, e gera dados estruturados de FAQ para o Google. A resposta aceita links em HTML, ex.: <a href=\"/pagina/\">texto</a>."
        fields:
          - { label: Pergunta, name: question, widget: string }
          - { label: Resposta, name: answer, widget: text }
      - label: Conteúdo do artigo
        name: body
        widget: markdown
        hint: "Use os botões da barra de ferramentas para títulos (H2 a H4), negrito, listas, links e imagens. Para inserir HTML bruto (embeds, tabelas avançadas etc.), clique em \"Markdown\" no rodapé do editor para alternar para o modo texto."
        modes: ["rich_text", "raw"]
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - quote
          - bulleted-list
          - numbered-list
        editor_components: [image]
        media_folder: "/public/articles/inline"
        public_folder: "/articles/inline"

  - name: pages
    label: Páginas Institucionais
    label_singular: Página
    description: "Textos de Sobre, Contato, Política de Privacidade e Política Editorial. Não crie nem apague itens aqui — as páginas do site apontam para estes 4 arquivos fixos."
    folder: src/content/pages
    create: false
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Título, name: title, widget: string }
      - { label: "Descrição (meta/SEO)", name: description, widget: text }
      - { label: Conteúdo, name: body, widget: markdown }

  - name: site-config
    label: Configurações do Site
    files:
      - name: config
        label: "Dados Gerais, Aparência, Silos e Afiliados"
        file: src/data/site-config.json
        fields:
          - label: Dados do Site
            name: site
            widget: object
            fields:
              - { label: Nome do site, name: name, widget: string }
              - { label: Slogan, name: tagline, widget: string }
              - { label: "Descrição (meta/SEO)", name: description, widget: text }
              - { label: URL do site, name: url, widget: string }
              - { label: E-mail de contato, name: email, widget: string }
              - { label: WhatsApp (DDI+DDD+número, só dígitos), name: whatsapp, widget: string }
              - { label: Nome do fundador/autor (E-E-A-T), name: founderName, widget: string }
              - { label: Locale, name: locale, widget: string }
              - { label: Idioma (lang), name: lang, widget: string }
          - label: "Aparência (Logo, Cores e Fontes)"
            name: design
            widget: object
            hint: "Controla o visual de todo o site. Alterações aqui afetam header, botões, títulos, links e texto em todas as páginas."
            fields:
              - label: Logo do cabeçalho
                name: logoUrl
                widget: image
                media_folder: "/public"
                public_folder: "/"
                hint: "Ideal: PNG ou WEBP com fundo transparente, altura em torno de 44px."
              - label: Favicon (ícone da aba do navegador)
                name: faviconUrl
                widget: image
                media_folder: "/public"
                public_folder: "/"
              - label: Cores
                name: colors
                widget: object
                fields:
                  - { label: "Primária (links, botões outline, cabeçalho)", name: primary, widget: color }
                  - { label: "Primária escura (títulos, rodapé)", name: primaryDark, widget: color }
                  - { label: "Destaque/acento (badges)", name: accent, widget: color }
                  - { label: "Destaque escuro (botões de CTA)", name: accentDark, widget: color }
                  - { label: "Fundo da página", name: background, widget: color }
                  - { label: "Fundo de seções alternadas", name: surface, widget: color }
                  - { label: "Texto principal", name: text, widget: color }
                  - { label: "Texto secundário/legendas", name: textMuted, widget: color }
                  - { label: "Bordas e divisórias", name: border, widget: color }
              - label: Fontes
                name: fonts
                widget: object
                fields:
                  - label: Fonte do corpo do texto
                    name: body
                    widget: select
                    options:
                      - { label: "Sans Moderna (padrão)", value: "system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" }
                      - { label: "Serifada Elegante", value: "Georgia, 'Times New Roman', Times, serif" }
                      - { label: "Serifada Editorial", value: "'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" }
                      - { label: "Arredondada Amigável", value: "-apple-system, 'Segoe UI', Verdana, 'Trebuchet MS', sans-serif" }
                  - label: Fonte dos títulos (H1-H4)
                    name: heading
                    widget: select
                    options:
                      - { label: "Sans Moderna (padrão)", value: "system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" }
                      - { label: "Serifada Elegante", value: "Georgia, 'Times New Roman', Times, serif" }
                      - { label: "Serifada Editorial", value: "'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" }
                      - { label: "Arredondada Amigável", value: "-apple-system, 'Segoe UI', Verdana, 'Trebuchet MS', sans-serif" }
              - label: Arredondamento de cantos
                name: radius
                widget: select
                options:
                  - { label: "Reto (sem arredondamento)", value: "0px" }
                  - { label: "Levemente arredondado", value: "6px" }
                  - { label: "Arredondado (padrão)", value: "10px" }
                  - { label: "Bem arredondado", value: "18px" }
                  - { label: "Pílula", value: "999px" }
          - label: Silos (Categorias do menu)
            name: silos
            widget: object
            fields:
              - label: Onde Comer
                name: onde-comer
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Descrição curta, name: shortDescription, widget: text }
                  - { label: Ícone (emoji), name: icon, widget: string }
              - label: O Que Fazer
                name: o-que-fazer
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Descrição curta, name: shortDescription, widget: text }
                  - { label: Ícone (emoji), name: icon, widget: string }
              - label: Onde Ficar
                name: onde-ficar
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Descrição curta, name: shortDescription, widget: text }
                  - { label: Ícone (emoji), name: icon, widget: string }
              - label: Guia Prático
                name: guia-pratico
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Descrição curta, name: shortDescription, widget: text }
                  - { label: Ícone (emoji), name: icon, widget: string }
          - label: Links de Afiliados
            name: affiliate
            widget: object
            fields:
              - label: Amazon
                name: amazon
                widget: object
                fields:
                  - { label: Texto do botão, name: label, widget: string }
                  - { label: URL base de busca, name: baseUrl, widget: string }
                  - { label: Tag de afiliado, name: tag, widget: string }
              - label: Mercado Livre
                name: mercadoLivre
                widget: object
                fields:
                  - { label: Texto do botão, name: label, widget: string }
                  - { label: URL base de busca, name: baseUrl, widget: string }
                  - { label: ID de afiliado, name: tag, widget: string }
              - label: Booking.com
                name: booking
                widget: object
                fields:
                  - { label: Texto do botão, name: label, widget: string }
                  - { label: URL base de busca, name: baseUrl, widget: string }
                  - { label: Affiliate ID (aid), name: aid, widget: string }
              - label: Rentcars
                name: rentcar
                widget: object
                fields:
                  - { label: Texto do botão, name: label, widget: string }
                  - { label: URL base de busca, name: baseUrl, widget: string }
                  - { label: Código de parceiro (ref), name: ref, widget: string }
