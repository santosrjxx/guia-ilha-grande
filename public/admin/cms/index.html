<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Editor — Guia Ilha Grande</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      CMS.registerPreviewStyle('/admin/cms/preview.css');

      CMS.registerEditorComponent({
        id: 'destaque',
        label: 'Destaque (caixa colorida)',
        fields: [
          {
            name: 'tipo',
            label: 'Tipo de destaque',
            widget: 'select',
            options: [
              { label: '💡 Dica', value: 'dica' },
              { label: '⚠️ Atenção', value: 'atencao' },
              { label: '❗ Importante', value: 'importante' },
            ],
            default: 'dica',
          },
          { name: 'texto', label: 'Texto do destaque', widget: 'text' },
        ],
        pattern: /^<div class="callout callout-(dica|atencao|importante)">\n\n([\s\S]*?)\n\n<\/div>$/,
        fromBlock: function (match) {
          return { tipo: match[1], texto: match[2] };
        },
        toBlock: function (obj) {
          return '<div class="callout callout-' + obj.tipo + '">\n\n' + (obj.texto || '') + '\n\n</div>';
        },
        toPreview: function (obj) {
          return '<div class="callout callout-' + obj.tipo + '">' + (obj.texto || '') + '</div>';
        },
      });

      CMS.registerEditorComponent({
        id: 'html',
        label: 'Código HTML (embed)',
        fields: [
          {
            name: 'code',
            label: 'Cole aqui o código HTML (ex.: embed do Google Maps, YouTube, widget de afiliado)',
            widget: 'text',
          },
        ],
        pattern: /^<!-- html-embed -->\n([\s\S]*?)\n<!-- \/html-embed -->$/,
        fromBlock: function (match) {
          return { code: match[1] };
        },
        toBlock: function (obj) {
          return '<!-- html-embed -->\n' + (obj.code || '') + '\n<!-- /html-embed -->';
        },
        toPreview: function (obj) {
          return obj.code || '';
        },
      });

      var ArticlePreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var data = entry.get('data');
          var silo = data.get('silo');
          var siloLabels = {
            'onde-comer': 'Onde Comer',
            'o-que-fazer': 'O Que Fazer',
            'onde-ficar': 'Onde Ficar',
            'guia-pratico': 'Guia Prático',
          };
          var heroImage = this.props.getAsset(data.get('heroImage'));
          var faq = data.get('faq');

          return h(
            'article',
            { className: 'container article', style: { paddingBlock: '2rem 3rem' } },
            h('p', { className: 'badge' }, siloLabels[silo] || silo),
            h('h1', {}, data.get('title')),
            h('p', { className: 'article-lead', style: { color: 'var(--color-text-muted)', fontSize: '1.1rem' } }, data.get('description')),
            heroImage &&
              h('img', {
                src: heroImage.toString(),
                alt: data.get('heroImageAlt') || data.get('title'),
                className: 'hero-image',
                style: { borderRadius: 'var(--radius)', marginBlock: '1.5rem' },
              }),
            h('div', { className: 'prose' }, this.props.widgetFor('body')),
            faq &&
              faq.size > 0 &&
              h(
                'section',
                { 'aria-label': 'Perguntas frequentes' },
                h('h2', {}, 'Perguntas frequentes'),
                faq.map(function (item, i) {
                  return h(
                    'details',
                    { key: i },
                    h('summary', {}, item.get('question')),
                    h('p', {}, item.get('answer'))
                  );
                })
              )
          );
        },
      });

      var PagePreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var data = entry.get('data');
          return h(
            'article',
            { className: 'container page', style: { paddingBlock: '2rem 3rem', maxWidth: '760px' } },
            h('h1', {}, data.get('title')),
            h('div', { className: 'prose' }, this.props.widgetFor('body'))
          );
        },
      });

      CMS.registerPreviewTemplate('articles', ArticlePreview);
      CMS.registerPreviewTemplate('pages', PagePreview);
    </script>
  </body>
</html>
