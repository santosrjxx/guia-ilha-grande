<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Editor — Guia Ilha Grande</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Aplica a cor verde-petróleo do site (--color-primary do site-config) nos
         botões, links e destaques do painel do Sveltia CMS, no lugar do azul
         padrão. Valores encontrados inspecionando as CSS custom properties que
         o Sveltia usa internamente (prefixo --sui-*). */
      /* !important é necessário: o CSS do próprio Sveltia CMS carrega depois
         deste <style> (via script mais abaixo) e re-declara essas mesmas
         variáveis em :root, então uma regra sem !important seria sobrescrita. */
      :root {
        --sui-primary-accent-color: hsl(176 76% 18%) !important;
        --sui-primary-accent-color-light: hsl(176 76% 24%) !important;
        --sui-primary-accent-color-dark: hsl(176 77% 12%) !important;
        --sui-primary-accent-color-text: hsl(176 55% 45%) !important;
        --sui-primary-accent-color-translucent: hsl(176 76% 30% / 60%) !important;
        --sui-primary-accent-color-translucent-light: hsl(176 76% 30% / 40%) !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      CMS.registerPreviewStyle('/admin/cms/preview.css');

      CMS.registerEditorComponent({
        id: 'destaque',
        label: 'Destaque (caixa colorida)',
        fields: [
          {
            name: 'tipo',
            label: 'Tipo de destaque',
            widget: 'select',
            options: [
              { label: '💡 Dica', value: 'dica' },
              { label: '⚠️ Atenção', value: 'atencao' },
              { label: '❗ Importante', value: 'importante' },
            ],
            default: 'dica',
          },
          { name: 'texto', label: 'Texto do destaque', widget: 'text' },
        ],
        pattern: /^<div class="callout callout-(dica|atencao|importante)">\n\n([\s\S]*?)\n\n<\/div>$/,
        fromBlock: function (match) {
          return { tipo: match[1], texto: match[2] };
        },
        toBlock: function (obj) {
          return '<div class="callout callout-' + obj.tipo + '">\n\n' + (obj.texto || '') + '\n\n</div>';
        },
        toPreview: function (obj) {
          return '<div class="callout callout-' + obj.tipo + '">' + (obj.texto || '') + '</div>';
        },
      });

      // Marcador de posição pro Card de Estabelecimento/Produto (ver src/remark-inline-cards.mjs
      // no build do site). Sem campos: só existe pra trocar o texto cru "%%estabelecimento%%" /
      // "%%produto%%" por uma caixinha identificável na edição e na prévia — o conteúdo de
      // verdade (foto, nome, descrição...) mora nos campos "Estabelecimentos/Produtos
      // recomendados" do artigo, não aqui.
      CMS.registerEditorComponent({
        id: 'estabelecimento-marcador',
        label: '📍 Posição do Card de Estabelecimento — pra editar foto/nome/descrição/links, use o campo "Estabelecimentos recomendados" mais abaixo no formulário',
        fields: [],
        pattern: /^%%estabelecimento%%$/,
        fromBlock: function () {
          return {};
        },
        toBlock: function () {
          return '%%estabelecimento%%';
        },
        toPreview: function () {
          return h(
            'div',
            {
              className: 'marcador-card',
              style: {
                border: '2px dashed #96601c',
                borderRadius: '10px',
                padding: '1rem 1.25rem',
                margin: '1.5rem 0',
                textAlign: 'center',
                fontWeight: 700,
                color: '#96601c',
                background: '#fff8ec',
              },
            },
            '🏨 Aqui entra o Card de Estabelecimento — pra editar foto/nome/descrição/links, use o campo "Estabelecimentos recomendados" mais abaixo'
          );
        },
      });

      CMS.registerEditorComponent({
        id: 'produto-marcador',
        label: '📍 Posição do Card de Produto — pra editar foto/nome/descrição/links, use o campo "Produtos recomendados" mais abaixo no formulário',
        fields: [],
        pattern: /^%%produto%%$/,
        fromBlock: function () {
          return {};
        },
        toBlock: function () {
          return '%%produto%%';
        },
        toPreview: function () {
          return h(
            'div',
            {
              className: 'marcador-card',
              style: {
                border: '2px dashed #96601c',
                borderRadius: '10px',
                padding: '1rem 1.25rem',
                margin: '1.5rem 0',
                textAlign: 'center',
                fontWeight: 700,
                color: '#96601c',
                background: '#fff8ec',
              },
            },
            '🃏 Aqui entra o Card de Produto — pra editar foto/nome/descrição/links, use o campo "Produtos recomendados" mais abaixo'
          );
        },
      });

      function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // Inverso de escapeHtml — usado pra reconstruir o texto original a partir
      // do HTML visível quando o editor reabre um bloco pra edição (fromBlock).
      // Ordem importa: &amp; precisa ser desfeito por último, senão um "&amp;lt;"
      // vira "<" em vez de "&lt;".
      function unescapeHtml(str) {
        return (str || '')
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&amp;/g, '&');
      }

      CMS.registerEditorComponent({
        id: 'html',
        label: 'Código HTML (embed)',
        fields: [
          {
            name: 'code',
            label: 'Cole aqui o código HTML (ex.: embed do Google Maps, YouTube, widget de afiliado)',
            widget: 'text',
          },
        ],
        // O código colado fica visível dentro da div (é isso que deve rodar no
        // site), e uma cópia escapada fica no atributo data-code só pra
        // recuperar o texto original ao reabrir — atributo HTML nunca aparece
        // como texto, então funciona igual no site (MDX) e nesta prévia
        // (Markdown puro), sem precisar de sintaxe de comentário.
        pattern: /^<div class="html-embed" data-code="[\s\S]*?">[\s\S]*<\/div>$/,
        fromBlock: function (match) {
          var m = match[0].match(/^<div class="html-embed" data-code="([\s\S]*?)">/);
          return { code: m ? unescapeHtml(m[1]) : '' };
        },
        toBlock: function (obj) {
          return (
            '<div class="html-embed" data-code="' + escapeHtml(obj.code || '') + '">\n' +
            (obj.code || '') +
            '\n</div>'
          );
        },
        toPreview: function (obj) {
          return obj.code || '';
        },
      });

      var ArticlePreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var data = entry.get('data');
          var silo = data.get('silo');
          var siloLabels = {
            'onde-comer': 'Onde Comer',
            'o-que-fazer': 'O Que Fazer',
            'onde-ficar': 'Onde Ficar',
            'guia-pratico': 'Guia Prático',
          };
          var heroImage = this.props.getAsset(data.get('heroImage'));
          var faq = data.get('faq');

          return h(
            'article',
            { className: 'container article', style: { paddingBlock: '2rem 3rem' } },
            h('p', { className: 'badge' }, siloLabels[silo] || silo),
            h('h1', {}, data.get('title')),
            h('p', { className: 'article-lead', style: { color: 'var(--color-text-muted)', fontSize: '1.1rem' } }, data.get('description')),
            heroImage &&
              h('img', {
                src: heroImage.toString(),
                alt: data.get('heroImageAlt') || data.get('title'),
                className: 'hero-image',
                style: { borderRadius: 'var(--radius)', marginBlock: '1.5rem' },
              }),
            h('div', { className: 'prose' }, this.props.widgetFor('body')),
            faq &&
              faq.size > 0 &&
              h(
                'section',
                { 'aria-label': 'Perguntas frequentes' },
                h('h2', {}, 'Perguntas frequentes'),
                faq.map(function (item, i) {
                  return h(
                    'details',
                    { key: i },
                    h('summary', {}, item.get('question')),
                    h('p', {}, item.get('answer'))
                  );
                })
              )
          );
        },
      });

      var PagePreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var data = entry.get('data');
          return h(
            'article',
            { className: 'container page', style: { paddingBlock: '2rem 3rem', maxWidth: '760px' } },
            h('h1', {}, data.get('title')),
            h('div', { className: 'prose' }, this.props.widgetFor('body'))
          );
        },
      });

      CMS.registerPreviewTemplate('articles', ArticlePreview);
      CMS.registerPreviewTemplate('pages', PagePreview);
    </script>
  </body>
</html>
